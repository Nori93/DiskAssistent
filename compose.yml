name: diskassistent

# ── Architecture ──────────────────────────────────────────────────────────────
#
#  Host OS  ──►  host-agent (native service, port 8003)
#                 │  no containers, direct filesystem access
#                 │
#  Podman   ──►  worker  (port 8002)  ──► calls host-agent for all FS ops
#            ──►  webapi  (port 8001)  ──► calls host-agent for disks / file ops
#            ──►  frontend (port 4200) ──► Angular SPA → /api/* → webapi
#
#  Before starting:
#   1. Install and start the Host Agent on the host OS:
#        Windows: python host-agent/install_service.py install
#        Linux:   sudo python host-agent/install_service.py install
#   2. Set HOST_AGENT_SECRET below (must match the agent secret).
#   3. Edit settings.container.json with host-side absolute paths.
#
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── WebAPI (REST API for the frontend) ──────────────────────────────────────
  # Worker-service runs NATIVELY on Windows for full filesystem access.
  # Webapi reaches the native worker via host.containers.internal:8002.
  webapi:
    build:
      context: .
      dockerfile: Containerfile.webapi
    ports:
      - "8001:8001"
    environment:
      WEBAPI_HOST: "0.0.0.0"
      WEBAPI_PORT: "8001"
      WORKER_URL: "http://host.containers.internal:8002"
      HOST_AGENT_SECRET: "${HOST_AGENT_SECRET:-}"
    volumes:
      - shared-db:/app/database
      - shared-logs:/app/logs
      - shared-thumbs:/app/frontend/static/img/thumbnails
      - ./settings.container.json:/app/settings.json:ro
    restart: unless-stopped

  # ── Frontend (Angular 18 built + served by nginx) ───────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Containerfile.frontend
    ports:
      - "4200:80"
    depends_on:
      - webapi
    restart: unless-stopped

volumes:
  shared-db:
  shared-logs:
  shared-thumbs:
