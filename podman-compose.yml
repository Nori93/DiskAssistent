name: diskassistent

services:

  # ── Worker Service (heavy ops: scan, archive, dedup, AI) ────────────────────
  worker:
    build:
      context: .
      dockerfile: Containerfile.worker
    ports:
      - "8002:8002"
    environment:
      WORKER_HOST: "0.0.0.0"
      WORKER_PORT: "8002"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    volumes:
      # Shared SQLite database
      - shared-db:/app/database
      # Shared logs
      - shared-logs:/app/logs
      # Shared thumbnails cache
      - shared-thumbs:/app/frontend/static/img/thumbnails
      # Container settings (uses Linux paths — edit settings.container.json, not settings.json)
      - ./settings.container.json:/app/settings.json:ro
      # ── Bind-mount your disk drives here for scanning ─────────────────────
      # Uncomment and adjust to the drives you want scanned.
      # Example Windows drive via WSL or Podman Desktop on Windows:
      # - /mnt/c:/mnt/c:ro
      # - /mnt/d:/mnt/d:ro
      #
      # Archive / dedup output directories (must match paths in settings.json)
      # - /mnt/e/Archive:/mnt/e/Archive
      # - /mnt/e/SharedDLL:/mnt/e/SharedDLL
    restart: unless-stopped

  # ── WebAPI (REST API for the frontend) ──────────────────────────────────────
  webapi:
    build:
      context: .
      dockerfile: Containerfile.webapi
    ports:
      - "8001:8001"
    environment:
      WEBAPI_HOST: "0.0.0.0"
      WEBAPI_PORT: "8001"
      WORKER_URL: "http://worker:8002"
    volumes:
      - shared-db:/app/database
      - shared-logs:/app/logs
      - shared-thumbs:/app/frontend/static/img/thumbnails
      - ./settings.container.json:/app/settings.json:ro
    depends_on:
      - worker
    restart: unless-stopped

  # ── Frontend (Angular 18 built + served by nginx) ───────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Containerfile.frontend
    ports:
      - "4200:80"
    depends_on:
      - webapi
    restart: unless-stopped

volumes:
  shared-db:
  shared-logs:
  shared-thumbs:
