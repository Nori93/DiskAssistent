<section class="page-content">
  <h1>Dashboard</h1>
  @if (stats) {
    <div class="stats-grid">
      <div class="stat-card">
        <h3>Total Files</h3>
        <p>{{ stats.total_files | number }}</p>
      </div>
      <div class="stat-card">
        <h3>Total Size</h3>
        <p>{{ stats.total_size_gb | number:'1.1-1' }} GB</p>
      </div>
      <div class="stat-card">
        <h3>Categories</h3>
        <p>{{ stats.categories_count }}</p>
      </div>
    </div>
  } @else {
    <p>Loading stats...</p>
  }
</section>
